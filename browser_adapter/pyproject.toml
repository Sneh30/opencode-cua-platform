[project]
name = "browser-adapter"
version = "0.1.0"
description = "Browser Adapter — MCP server for browser automation via Browser-Use"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "browser-use>=0.13.8",
    "mcp[cli]==1.26.0",
]

[project.scripts]
browser-adapter = "mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", ".."]